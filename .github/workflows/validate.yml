name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff==0.17.3
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile integration and tests
        run: python -m compileall -q custom_components tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `topics` is ignored because repository topics can only be set by the
      # repository owner (GitHub Settings -> About), not by a scoped token.
      # Leaving it enforced made every nightly run fail, which trains everyone
      # to ignore this workflow and hides a real hassfest/HACS break.
      # The step below keeps the gap visible without failing the run.
      # Once topics are set, drop the `ignore` input and this comment.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: topics
      - name: Report repository topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/$REPO/topics" \
                  | jq '.names | length')
          if [ "$count" = "0" ]; then
            echo "::warning title=Repository topics are not set::The HACS topics check is ignored in this workflow because topics need repository-owner access. Set them under Settings -> About to become eligible for the HACS/Marketplace catalog, then remove the 'ignore: topics' input."
          else
            echo "Repository has $count topics - remove the 'ignore: topics' input from this workflow."
          fi
